runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 1
  concurrency: 80

buildCommand: |
  curl -o flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.27.4-stable.tar.xz
  tar xf flutter.tar.xz
  export PATH="$PATH:`pwd`/flutter/bin"
  flutter pub get
  flutter build web --release

outputDirectory: build/web
