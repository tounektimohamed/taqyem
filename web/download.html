<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل تطبيق تقييم - Taqyem</title>
  <link rel="icon" type="image/png" href="icons/cigle-meh.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
    }

    .app-icon {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .app-icon svg {
      width: 60px;
      height: 60px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 30px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
    }

    .download-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .download-btn svg {
      width: 24px;
      height: 24px;
    }

    .qr-section {
      margin-top: 30px;
      text-align: center;
    }

    .qr-section h3 {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 15px;
    }

    .qr-code {
      display: inline-block;
      padding: 15px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .qr-code img {
      width: 150px;
      height: 150px;
    }

    .direct-link {
      margin-top: 20px;
      text-align: center;
    }

    .direct-link a {
      color: #4f46e5;
      font-size: 13px;
      text-decoration: none;
    }

    .direct-link a:hover {
      text-decoration: underline;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #e5e7eb;
    }

    .feature {
      text-align: center;
    }

    .feature-icon {
      width: 40px;
      height: 40px;
      background: #f3f4f6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      color: #4f46e5;
    }

    .feature span {
      font-size: 11px;
      color: #6b7280;
    }

    .version {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12l2 2 4-4" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2"/>
        </svg>
      </div>
      <h1>تقييم</h1>
      <p>تطبيق تقييم التلاميذ والمتابعة</p>
    </div>

    <div class="content">
      <button class="download-btn" id="downloadBtn" onclick="downloadApp()">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        تحميل التطبيق
      </button>

      <div class="qr-section">
        <h3>امسح هذا الرمز للتحميل</h3>
        <div class="qr-code">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://portfolio-8d8de.web.app/download.html" alt="QR Code">
        </div>
      </div>

      <div class="direct-link">
        <a href="#" id="apkLink" onclick="downloadApp()">جاري التحميل...</a>
      </div>

      <div id="errorMsg" class="error-msg" style="display: none;">
        عذراً، الرابط غير متوفر حالياً
      </div>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <span>مجاني</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <span>متوافق</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
          </div>
          <span>سريع</span>
        </div>
      </div>

      <div class="version" id="versionInfo">
        جاري تحميل معلومات الإصدار...
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyCuzZQDt6eBErRHZK3ZAInanLqHE4iw3oE',
      appId: '1:1027057481100:web:0730b43a791acb845512a9',
      messagingSenderId: '1027057481100',
      projectId: 'portfolio-8d8de',
      authDomain: 'portfolio-8d8de.firebaseapp.com',
      storageBucket: 'portfolio-8d8de.appspot.com',
      measurementId: 'G-6F9E00FKLZ',
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let apkUrl = null;

    async function loadAppInfo() {
      try {
        const doc = await db.collection('app_info').doc('download').get();
        
        if (doc.exists && doc.data()) {
          const data = doc.data();
          apkUrl = data.apkUrl;
          
          document.getElementById('versionInfo').textContent = 'الإصدار ' + (data.version || '1.0.0');
          document.getElementById('apkLink').textContent = 'رابط التحميل المباشر';
        } else {
          document.getElementById('versionInfo').textContent = 'الإصدار 1.0.0';
          document.getElementById('apkLink').textContent = 'رابط التحميل المباشر';
          showError();
        }
      } catch (error) {
        console.error('Error loading app info:', error);
        document.getElementById('versionInfo').textContent = 'الإصدار 1.0.0';
        showError();
      }
    }

    function showError() {
      document.getElementById('errorMsg').style.display = 'block';
    }

    function downloadApp() {
      if (!apkUrl) {
        showError();
        return;
      }
      window.location.href = apkUrl;
    }

    loadAppInfo();
  </script>
</body>
</html>
